name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend (build, migrations, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore StockForge.slnx
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build StockForge.slnx -c Release --no-restore

      - name: Check migrations match the model
        run: dotnet ef migrations has-pending-model-changes -p src/StockForge.Infrastructure -s src/StockForge.Infrastructure --no-build -c Release

      # Integration tests start PostgreSQL 18 with Testcontainers (Docker is available on hosted runners).
      - name: Test
        run: dotnet test --project tests/StockForge.Tests -c Release --no-build --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dotnet.Dockerfile
          build-args: PROJECT=StockForge.API
          tags: stockforge-api:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dotnet.Dockerfile
          build-args: PROJECT=StockForge.Worker
          tags: stockforge-worker:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8080
          tags: stockforge-web:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
