# Gateway in front of N API replicas (`docker compose up --scale api=3`).
# Requests are spread across replicas; a client sticks to one replica (consistent hash on client IP) so the
# SignalR negotiate → connect handshake lands on the same instance. Messages fan out via the Redis backplane.
worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    client_max_body_size 4m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream stockforge_api {
        zone stockforge_api 64k;   # required for `resolve` (re-resolves replica IPs as they scale)
        hash $remote_addr consistent;
        server api:8080 resolve;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://stockforge_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
